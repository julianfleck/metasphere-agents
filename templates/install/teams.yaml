# Metasphere agent-team roster.
#
# Maps each persistent agent to the project(s) whose per-project
# LEARNINGS.md / MEMORY.md should land in their per-turn context
# capsule. This is the canonical alternative to MISSION.md
# frontmatter — use this when agent names don't follow the
# ``<project>-<role>`` convention (e.g. @spot, @orchestrator), or
# when the agent needs visibility into multiple projects.
#
# Resolution precedence in the project capsule:
#   1. MISSION.md ``project:`` / ``projects:`` frontmatter (explicit
#      per-agent override; highest priority).
#   2. This file (centralized team config; default for most agents).
#   3. Path-nested inference (agent dir at
#      ``~/.metasphere/projects/<P>/agents/@<id>/`` resolves to ``<P>``).
#   4. No capsule when none of the above resolve.
#
# Schema:
#   agents:
#     <agent-name-without-@>:
#       projects: [<project-name>, ...]   # list, even with one entry
#       # OR equivalently:
#       # projects: <project-name>         # scalar shorthand
#
# Adding a new agent:
#   1. Add an ``<agent-name>:`` block under ``agents:`` with their
#      ``projects:`` list.
#   2. Save. The capsule refreshes on the next per-turn tick (~5s).
#   3. If the agent already has a live tmux session, no restart is
#      needed for the capsule itself; restart only if you also
#      changed their MISSION.md or persona files.
#
# Multi-project agents (orchestrator-style):
#   agents:
#     orchestrator:
#       projects: [alpha, beta, gamma]
#   One ``## Project: <name>`` section renders per listed project,
#   each with its own LEARNINGS/MEMORY recency window + footer.
#
# Operator notes:
# - Edits take effect on the next per-turn context build (~5s after save).
# - Removing an agent from this file does NOT delete their state; it
#   only stops their project capsule from rendering.
# - Re-running ``install.sh`` is non-overwriting: if this file
#   already exists on disk, install.sh skips it. Operator edits to
#   ``~/.metasphere/teams.yaml`` are preserved across upgrades.
# - To pick up new team-config schema improvements that DO require a
#   refreshed template, diff this shipped file against
#   ``~/.metasphere/teams.yaml`` and merge by hand.
#
# See ``~/.metasphere/CLAUDE.md`` (the operator manual) for the
# resolution chain in context and ``docs/PROJECTS.md`` for design
# rationale.

# Example roster. Replace with your own agents and projects after
# install — install.sh skips this file when ~/.metasphere/teams.yaml
# already exists, so per-host edits survive upgrades.
agents:
  orchestrator:
    projects: [metasphere-agents]

  # Single-project team example:
  # alpha-eng:
  #   projects: [alpha]
  # alpha-critic:
  #   projects: [alpha]
  # alpha-lead:
  #   projects: [alpha]
  # alpha-research:
  #   projects: [alpha]

  # Multi-project agent example:
  # beta-research:
  #   projects: [beta, gamma]
